// build.gradle (Module: app)
// 合成星核 — Android WebView 壳应用
// 集成 Dirichlet (TapADN) 广告 SDK + 微信支付 SDK

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.starcore.merge'
    compileSdk 34

    defaultConfig {
        applicationId "com.starcore.merge"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.2.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }

    signingConfigs {
        release {
            def keyProps = new Properties()
            def keyFile = file('keystore.properties')
            if (keyFile.exists()) {
                keyFile.withInputStream { keyProps.load(it) }
                storeFile file(keyProps['storeFile'])
                storePassword keyProps['storePassword']
                keyAlias keyProps['keyAlias']
                keyPassword keyProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

repositories {
    flatDir {
        dirs 'src/main/libs'
    }
}

dependencies {
    // AndroidX
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.webkit:webkit:1.8.0'

    // Dirichlet (TapADN) 广告 SDK 4.2.8.0
    // 需要将 dirichlet_ad_4.2.8.0.aar 放入 src/main/libs/ 目录
    implementation(name: "dirichlet_ad_4.2.8.0", ext: "aar")
    implementation 'com.squareup.okhttp3:okhttp:3.12.1'
    implementation "com.android.support:appcompat-v7:28.0.0"
    implementation "com.android.support:support-annotations:28.0.0"
    implementation "com.android.support:support-v4:28.0.0"
    implementation "com.github.bumptech.glide:glide:4.9.0"
    implementation 'com.android.support:recyclerview-v7:28.0.0'

    // 微信支付 SDK
    implementation 'com.tencent.mm.opensdk:wechat-sdk-android:6.8.0'

    // 支付宝 SDK
    implementation 'com.alipay.sdk:alipaysdk-android:15.8.17'

    // JSON 解析
    implementation 'com.google.code.gson:gson:2.10.1'
}
